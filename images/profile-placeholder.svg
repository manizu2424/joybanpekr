<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="ai-title ai-desc">
  <title id="ai-title">Joyban AI profile</title>
  <desc id="ai-desc">AI 스타일의 Joyban 프로필 이미지 — 신경망 노드와 민트 컬러 테마.</desc>
  <defs>
    <!-- 배경 그라디언트 -->
    <radialGradient id="bg-radial" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="60%" stop-color="#0d1a1f"/>
      <stop offset="100%" stop-color="#080c0e"/>
    </radialGradient>
    <!-- 민트 글로우 그라디언트 -->
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78f0cf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#78f0cf" stop-opacity="0"/>
    </radialGradient>
    <!-- 선 색상 -->
    <filter id="node-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="center-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 배경 원 -->
  <circle cx="160" cy="160" r="160" fill="url(#bg-radial)"/>

  <!-- 중앙 글로우 -->
  <circle cx="160" cy="160" r="90" fill="url(#glow-center)"/>

  <!-- 신경망 연결선 -->
  <g stroke="#78f0cf" stroke-opacity="0.25" stroke-width="1" fill="none">
    <!-- 중앙 → 외부 노드 -->
    <line x1="160" y1="160" x2="90"  y2="80"/>
    <line x1="160" y1="160" x2="230" y2="75"/>
    <line x1="160" y1="160" x2="255" y2="160"/>
    <line x1="160" y1="160" x2="230" y2="245"/>
    <line x1="160" y1="160" x2="90"  y2="248"/>
    <line x1="160" y1="160" x2="62"  y2="160"/>
    <!-- 외부 노드 간 연결 -->
    <line x1="90"  y1="80"  x2="230" y2="75"/>
    <line x1="230" y1="75"  x2="255" y2="160"/>
    <line x1="255" y1="160" x2="230" y2="245"/>
    <line x1="230" y1="245" x2="90"  y2="248"/>
    <line x1="90"  y1="248" x2="62"  y2="160"/>
    <line x1="62"  y1="160" x2="90"  y2="80"/>
    <!-- 중간 레이어 연결 -->
    <line x1="90"  y1="80"  x2="120" y2="115"/>
    <line x1="230" y1="75"  x2="200" y2="115"/>
    <line x1="255" y1="160" x2="210" y2="160"/>
    <line x1="230" y1="245" x2="200" y2="205"/>
    <line x1="90"  y1="248" x2="120" y2="205"/>
    <line x1="62"  y1="160" x2="110" y2="160"/>
  </g>

  <!-- 중간 레이어 노드 -->
  <g filter="url(#node-glow)">
    <circle cx="120" cy="115" r="5" fill="#78f0cf" opacity="0.7"/>
    <circle cx="200" cy="115" r="5" fill="#78f0cf" opacity="0.7"/>
    <circle cx="210" cy="160" r="5" fill="#78f0cf" opacity="0.7"/>
    <circle cx="200" cy="205" r="5" fill="#78f0cf" opacity="0.7"/>
    <circle cx="120" cy="205" r="5" fill="#78f0cf" opacity="0.7"/>
    <circle cx="110" cy="160" r="5" fill="#78f0cf" opacity="0.7"/>
  </g>

  <!-- 외부 노드 -->
  <g filter="url(#node-glow)">
    <circle cx="90"  cy="80"  r="7" fill="#78f0cf" opacity="0.9"/>
    <circle cx="230" cy="75"  r="7" fill="#78f0cf" opacity="0.9"/>
    <circle cx="255" cy="160" r="7" fill="#78f0cf" opacity="0.9"/>
    <circle cx="230" cy="245" r="7" fill="#78f0cf" opacity="0.9"/>
    <circle cx="90"  cy="248" r="7" fill="#78f0cf" opacity="0.9"/>
    <circle cx="62"  cy="160" r="7" fill="#78f0cf" opacity="0.9"/>
  </g>

  <!-- 중앙 핵심 노드 (pulse 애니메이션) -->
  <circle cx="160" cy="160" r="22" fill="#0a0b0d" stroke="#78f0cf" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="22;26;22" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="160" r="14" fill="#78f0cf" filter="url(#center-glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 테두리 원 (클리핑용) -->
  <circle cx="160" cy="160" r="159" fill="none" stroke="#78f0cf" stroke-opacity="0.12" stroke-width="1"/>
</svg>
