<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0b0d" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>관리자 글쓰기 - Joyban</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="container">
        <h1 class="logo"><a href="index.html">joyban Admin</a></h1>
        <button class="mobile-menu-toggle" aria-label="메뉴 열기">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="main-nav">
          <ul class="menu-links">
            <li><a href="board.html?category=aiworld">AI 이야기</a></li>
            <li><a href="board.html?category=works">만든 것들</a></li>
            <li><a href="board.html?category=vision">생각정리</a></li>
            <li><a href="board.html?category=skillup">배움노트</a></li>
          </ul>
          <a href="#" class="admin-login-btn"><i class="fas fa-lock"></i></a>
        </nav>
      </div>
    </header>

    <main class="container write-page">
      <div class="write-container">
        <div id="authNotice" class="write-notice" style="display: none">
          <i class="fas fa-lock"></i>
          <div>
            <strong>관리자 로그인이 필요합니다.</strong>
            <p>우측 상단 자물쇠 아이콘을 눌러 로그인한 뒤 글을 작성할 수 있습니다.</p>
          </div>
        </div>
        <div class="write-header">
          <div>
            <h2 id="pageTitle">새 게시글 작성</h2>
            <p id="pageDesc">카테고리를 선택하고 기록할 내용을 작성하세요.</p>
          </div>
          <a href="index.html" class="btn-subtle">홈으로</a>
        </div>
        <form id="writeForm" enctype="multipart/form-data">
          <input type="hidden" name="id" id="postId" />
          <div class="form-group">
            <label for="category">카테고리</label>
            <select name="category" id="category" class="form-control" required>
              <option value="aiworld">AI 이야기</option>
              <option value="works">만든 것들</option>
              <option value="vision">생각정리</option>
              <option value="skillup">배움노트</option>
            </select>
          </div>
          <div class="form-group">
            <label for="title">제목</label>
            <input
              type="text"
              name="title"
              id="title"
              class="form-control"
              required
              placeholder="제목을 입력하세요"
            />
          </div>
          <div class="form-group">
            <label for="content">내용</label>
            <textarea
              name="content"
              id="content"
              class="form-control"
              required
              placeholder="내용을 입력하세요"
            ></textarea>
          </div>
          <div class="form-group">
            <label for="files">파일 첨부 (다중 선택 가능)</label>
            <input
              type="file"
              name="files[]"
              id="files"
              class="form-control"
              multiple
              accept="image/*,video/*,application/pdf"
            />
            <div class="file-list" id="fileList"></div>
            <div id="existingFiles" style="margin-top: 10px; color: #666"></div>
          </div>
          <button type="submit" class="btn-submit" id="submitBtn">저장하기</button>
        </form>
      </div>
    </main>

    <script>
      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]));
      }

      function setFormDisabled(isDisabled) {
        document
          .querySelectorAll("#writeForm input, #writeForm textarea, #writeForm select, #submitBtn")
          .forEach((element) => {
            element.disabled = isDisabled;
          });
      }

      async function guardAdminAccess() {
        try {
          const response = await fetch("api/auth/status.php");
          const result = await response.json();
          const isLoggedIn = Boolean(result.isLoggedIn);
          document.getElementById("authNotice").style.display = isLoggedIn ? "none" : "flex";
          setFormDisabled(!isLoggedIn);
          return isLoggedIn;
        } catch (error) {
          document.getElementById("authNotice").style.display = "flex";
          setFormDisabled(true);
          return false;
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const isLoggedIn = await guardAdminAccess();
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get("id");
        const category = urlParams.get("category");
        const categorySelect = document.getElementById("category");

        if (postId && isLoggedIn) {
          document.getElementById("pageTitle").textContent = "게시글 수정";
          document.getElementById("pageDesc").textContent = "기존 게시글 내용을 수정하고 필요한 파일을 추가하세요.";
          document.getElementById("postId").value = postId;
          await loadPostData(postId);
        } else if (
          category &&
          Array.from(categorySelect.options).some((option) => option.value === category)
        ) {
          categorySelect.value = category;
        }
      });

      async function loadPostData(id) {
        try {
          const response = await fetch(`api/posts/detail.php?id=${id}`);
          const result = await response.json();

          if (result.status === "success") {
            const post = result.data;
            document.getElementById("category").value = post.category;
            document.getElementById("title").value = post.title;
            document.getElementById("content").value = post.content;

            // 기존 파일 목록 표시 (삭제 기능은 추후 구현 필요 시 추가)
            if (post.media && post.media.length > 0) {
              const existingDiv = document.getElementById("existingFiles");
              existingDiv.innerHTML = "<strong>기존 첨부파일:</strong>";
              const list = document.createElement("ul");
              list.className = "existing-file-list";
              post.media.forEach((file) => {
                const item = document.createElement("li");
                item.textContent = file.original_name || "첨부파일";
                list.appendChild(item);
              });
              existingDiv.appendChild(list);
            }
          } else {
            UIManager.showToast("게시글 정보를 불러올 수 없습니다.", "error");
            setTimeout(() => (location.href = "index.html"), 1000);
          }
        } catch (error) {
          console.error("Error loading post:", error);
        }
      }

      document
        .getElementById("writeForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const formData = new FormData(e.target);
          const postId = document.getElementById("postId").value;
          const url = postId ? "api/posts/update.php" : "api/posts/create.php";
          const submitBtn = document.getElementById("submitBtn");
          submitBtn.disabled = true;
          submitBtn.textContent = postId ? "수정 중..." : "저장 중...";

          try {
            const response = await fetch(url, {
              method: "POST",
              body: formData,
            });
            const result = await response.json();

            if (result.status === "success") {
              UIManager.showToast(
                postId
                  ? "게시글이 수정되었습니다."
                  : "게시글이 등록되었습니다.",
                "success"
              );
              const category = document.getElementById("category").value;
              setTimeout(() => {
                location.href = postId
                  ? `view.html?id=${result.post_id}`
                  : `board.html?category=${category}`;
              }, 1000);
            } else {
              UIManager.showToast("오류: " + result.message, "error");
              submitBtn.disabled = false;
              submitBtn.textContent = "저장하기";
            }
          } catch (error) {
            UIManager.showToast(
              "서버 통신 중 오류가 발생했습니다. 로그인이 되어있는지 확인해주세요.",
              "error"
            );
            submitBtn.disabled = false;
            submitBtn.textContent = "저장하기";
          }
        });

      // 파일 선택 시 목록 표시
      document.getElementById("files").addEventListener("change", (e) => {
        const list = document.getElementById("fileList");
        list.innerHTML = "";
        for (const file of e.target.files) {
          const item = document.createElement("div");
          item.className = "file-preview-item";
          if (file.type.startsWith("image/")) {
            const image = document.createElement("img");
            image.src = URL.createObjectURL(file);
            image.alt = file.name;
            image.onload = () => URL.revokeObjectURL(image.src);
            item.appendChild(image);
          } else {
            const icon = document.createElement("i");
            icon.className = file.type.startsWith("video/") ? "fas fa-film" : "fas fa-file-lines";
            item.appendChild(icon);
          }
          const name = document.createElement("span");
          name.textContent = file.name;
          item.appendChild(name);
          list.appendChild(item);
        }
      });
    </script>
    <script src="js/app.js"></script>
  </body>
</html>
