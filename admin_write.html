<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#121418" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>기록 작성 - Joyban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/portal.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body class="portal record-page">
    <a class="skip-link" href="#writeForm">본문으로 이동</a>
    <header class="portal-header">
      <div class="container">
        <a class="portal-brand" href="index.html"><img class="brand-bot" src="images/portal-brand-icon.png" alt="" width="28" height="28" /> joyban</a>
        <p class="brand-line">직접 남긴 기록</p>
        <div class="header-actions">
          <a href="index.html">보관함</a>
          <a href="#" class="admin-login-btn"><i class="fas fa-lock"></i><span class="auth-label">로그인</span></a>
        </div>
      </div>
    </header>

    <main class="container write-page">
      <div class="shelf-nav">
        <ul class="menu-links">
          <li><a href="board.html?category=aiworld">AI 이야기</a></li>
          <li><a href="board.html?category=works">만든 것들</a></li>
          <li><a href="board.html?category=vision">생각정리</a></li>
          <li><a href="board.html?category=skillup">배움노트</a></li>
        </ul>
      </div>
      <div class="write-container">
        <div id="authNotice" class="write-notice" style="display: none">
          <p>로그인하면 글을 쓸 수 있습니다. 오른쪽 위의 로그인을 누르세요.</p>
        </div>
        <div class="write-header">
          <div>
            <h2 id="pageTitle">새 기록</h2>
            <p id="pageDesc">분야를 고르고 내용을 적으세요.</p>
          </div>
          <a id="backLink" href="board.html?category=aiworld" class="btn-subtle">목록으로</a>
        </div>
        <form id="writeForm" enctype="multipart/form-data">
          <input type="hidden" name="id" id="postId" />
          <div class="form-group">
            <label for="category">분야</label>
            <select name="category" id="category" class="form-control" required>
              <option value="aiworld">AI 이야기</option>
              <option value="works">만든 것들</option>
              <option value="vision">생각정리</option>
              <option value="skillup">배움노트</option>
            </select>
          </div>
          <div class="form-group">
            <label for="title">제목</label>
            <input
              type="text"
              name="title"
              id="title"
              class="form-control"
              required
              placeholder="제목을 입력하세요"
            />
          </div>
          <div class="form-group">
            <label for="content">내용</label>
            <textarea
              name="content"
              id="content"
              class="form-control"
              required
              placeholder="내용을 입력하세요"
            ></textarea>
          </div>
          <div class="form-group">
            <label for="files">첨부파일</label>
            <input
              type="file"
              name="files[]"
              id="files"
              class="form-control"
              multiple
              accept=".jpg,.jpeg,.png,.gif,.mp4,.pdf"
            />
            <p class="form-help">JPG, PNG, GIF, MP4, PDF · 파일당 20MB 이하 · 한 번에 최대 10개 (서버 제한이 더 작을 수 있습니다)</p>
            <div class="file-list" id="fileList"></div>
            <div id="existingFiles"></div>
          </div>
          <button type="submit" class="btn-submit" id="submitBtn">저장하기</button>
        </form>
      </div>
    </main>
    <footer class="portal-footer container"><span>joyban.pe.kr</span></footer>

    <script>
      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]));
      }

      function setFormDisabled(isDisabled) {
        document
          .querySelectorAll("#writeForm input, #writeForm textarea, #writeForm select, #submitBtn")
          .forEach((element) => {
            element.disabled = isDisabled;
          });
      }

      async function guardAdminAccess() {
        try {
          const response = await fetch("api/auth/status.php");
          const result = await response.json();
          const isLoggedIn = Boolean(result.isLoggedIn);
          document.getElementById("authNotice").style.display = isLoggedIn ? "none" : "flex";
          setFormDisabled(!isLoggedIn);
          return isLoggedIn;
        } catch (error) {
          document.getElementById("authNotice").style.display = "flex";
          setFormDisabled(true);
          return false;
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const isLoggedIn = await guardAdminAccess();
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get("id");
        const category = urlParams.get("category");
        const categorySelect = document.getElementById("category");

        const markCategory = (value) => {
          document.querySelectorAll(".menu-links a").forEach((link) => {
            const url = new URL(link.href, window.location.href);
            link.classList.toggle("active", url.searchParams.get("category") === value);
          });
          document.getElementById("backLink").href = `board.html?category=${encodeURIComponent(value)}`;
        };
        categorySelect.addEventListener("change", () => markCategory(categorySelect.value));

        if (postId && isLoggedIn) {
          document.getElementById("pageTitle").textContent = "기록 수정";
          document.getElementById("pageDesc").textContent = "내용과 첨부파일을 고칩니다.";
          document.getElementById("postId").value = postId;
          await loadPostData(postId);
          markCategory(categorySelect.value);
        } else if (
          category &&
          Array.from(categorySelect.options).some((option) => option.value === category)
        ) {
          categorySelect.value = category;
          markCategory(category);
        } else {
          markCategory(categorySelect.value);
        }
      });

      async function loadPostData(id) {
        try {
          const response = await fetch(`api/posts/detail.php?id=${encodeURIComponent(id)}&mode=edit`);
          const result = await response.json();

            if (result.status === "success") {
            const post = result.data;
            document.getElementById("category").value = post.category;
            document.getElementById("title").value = post.title;
            document.getElementById("content").value = post.content;
            document.getElementById("backLink").href = `board.html?category=${encodeURIComponent(post.category)}`;

            // 기존 파일 목록 표시 (삭제 버튼 포함)
            if (post.media && post.media.length > 0) {
              const existingDiv = document.getElementById("existingFiles");
              existingDiv.innerHTML = "<strong>기존 첨부파일:</strong>";
              const list = document.createElement("ul");
              list.className = "existing-file-list";
              post.media.forEach((file) => {
                const item = document.createElement("li");
                item.className = "existing-file-item";
                item.dataset.fileId = file.id;

                const icon = document.createElement("i");
                const ext = (file.original_name || '').split('.').pop().toLowerCase();
                const isImage = ['jpg','jpeg','png','gif','webp','svg'].includes(ext);
                icon.className = isImage ? "fas fa-image" : "fas fa-file-lines";

                const nameSpan = document.createElement("span");
                nameSpan.textContent = file.original_name || "첨부파일";

                const removeBtn = document.createElement("button");
                removeBtn.type = "button";
                removeBtn.className = "existing-file-remove-btn";
                removeBtn.innerHTML = '<i class="fas fa-times"></i>';
                removeBtn.title = "이 파일 삭제";
                removeBtn.onclick = () => {
                  item.classList.toggle("deleted");
                  const isDeleted = item.classList.contains("deleted");
                  // 삭제할 파일 ID를 hidden input으로 추가/제거
                  const existingHidden = document.querySelector(`input[name="delete_files[]"][value="${file.id}"]`);
                  if (isDeleted && !existingHidden) {
                    const hidden = document.createElement("input");
                    hidden.type = "hidden";
                    hidden.name = "delete_files[]";
                    hidden.value = file.id;
                    document.getElementById("writeForm").appendChild(hidden);
                  } else if (!isDeleted && existingHidden) {
                    existingHidden.remove();
                  }
                  removeBtn.title = isDeleted ? "삭제 취소" : "이 파일 삭제";
                  removeBtn.style.color = isDeleted ? "var(--accent)" : "";
                };

                item.appendChild(icon);
                item.appendChild(nameSpan);
                item.appendChild(removeBtn);
                list.appendChild(item);
              });
              existingDiv.appendChild(list);
            }
          } else {
            UIManager.showToast("게시글 정보를 불러올 수 없습니다.", "error");
            setTimeout(() => (location.href = "index.html"), 1000);
          }
        } catch (error) {
          console.error("Error loading post:", error);
        }
      }

      document
        .getElementById("writeForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const formData = new FormData(e.target);
          const postId = document.getElementById("postId").value;
          const url = postId ? "api/posts/update.php" : "api/posts/create.php";
          const submitBtn = document.getElementById("submitBtn");
          submitBtn.disabled = true;
          submitBtn.textContent = postId ? "수정 중..." : "저장 중...";

          try {
            const response = await adminFetch(url, {
              method: "POST",
              body: formData,
            });
            const result = await response.json();

            if (result.status === "success") {
              UIManager.showToast(
                postId
                  ? "게시글이 수정되었습니다."
                  : "게시글이 등록되었습니다.",
                "success"
              );
              const category = document.getElementById("category").value;
              setTimeout(() => {
                location.href = postId
                  ? `view.html?id=${result.post_id}`
                  : `board.html?category=${category}`;
              }, 1000);
            } else {
              UIManager.showToast("오류: " + result.message, "error");
              submitBtn.disabled = false;
              submitBtn.textContent = "저장하기";
            }
          } catch (error) {
            UIManager.showToast(
              "서버 통신 중 오류가 발생했습니다. 로그인이 되어있는지 확인해주세요.",
              "error"
            );
            submitBtn.disabled = false;
            submitBtn.textContent = "저장하기";
          }
        });

      // 파일 선택 시 목록 표시 (DataTransfer API로 개별 삭제 지원)
      let selectedFiles = []; // 선택된 파일을 배열로 관리

      function renderFileList() {
        const list = document.getElementById("fileList");
        list.innerHTML = "";

        selectedFiles.forEach((file, index) => {
          const item = document.createElement("div");
          item.className = "file-preview-item";

          if (file.type.startsWith("image/")) {
            const image = document.createElement("img");
            image.src = URL.createObjectURL(file);
            image.alt = file.name;
            image.onload = () => URL.revokeObjectURL(image.src);
            item.appendChild(image);
          } else {
            const icon = document.createElement("i");
            icon.className = (file.type.startsWith("video/") ? "fas fa-film" : "fas fa-file-lines") + " file-icon";
            item.appendChild(icon);
          }

          const name = document.createElement("span");
          name.textContent = file.name;
          item.appendChild(name);

          // 삭제 버튼
          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "file-remove-btn";
          removeBtn.innerHTML = '<i class="fas fa-times"></i>';
          removeBtn.title = "파일 삭제";
          removeBtn.onclick = () => {
            selectedFiles.splice(index, 1);
            syncFilesToInput();
            renderFileList();
          };
          item.appendChild(removeBtn);

          list.appendChild(item);
        });
      }

      // 선택된 파일 배열을 <input type="file">에 동기화
      function syncFilesToInput() {
        const dt = new DataTransfer();
        selectedFiles.forEach(f => dt.items.add(f));
        document.getElementById("files").files = dt.files;
      }

      document.getElementById("files").addEventListener("change", (e) => {
        // 기존 목록에 새 파일을 추가 (중복 제외)
        const newFiles = Array.from(e.target.files);
        newFiles.forEach(newFile => {
          const isDuplicate = selectedFiles.some(f => f.name === newFile.name && f.size === newFile.size);
          if (!isDuplicate) selectedFiles.push(newFile);
        });
        syncFilesToInput();
        renderFileList();
      });

    </script>
    <script src="js/app.js"></script>
  </body>
</html>
